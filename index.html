<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alexis & John — Our Invitation</title><style>
:root{--green:#183f35;--gold:#b79c62;--cream:#f6f0df}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#f8f1e6,#e6d9c7);color:var(--green);font-family:Georgia,serif;text-align:center}main{max-width:640px;margin:auto;padding:28px 18px 80px}h1{font-weight:normal;font-size:clamp(35px,9vw,58px);margin:5px 0 7px}.date{font-size:12px;letter-spacing:.3em;margin-bottom:25px}.hint{min-height:2.5em;font-size:16px}.stage{height:340px;position:relative;display:grid;place-items:center;overflow:visible}.envelope{width:min(78vw,350px);height:230px;position:relative;filter:drop-shadow(0 13px 12px #34281e33);cursor:pointer;perspective:900px}.envelope .back{position:absolute;inset:0;background:#20483d;border-radius:4px}.lining{position:absolute;inset:3px 3px auto;width:calc(100% - 6px);height:215px;clip-path:polygon(50% 0,100% 75%,100% 100%,0 100%,0 75%);background-image:url(liner.webp);background-size:100% 100%;transform:translateY(-12px);opacity:0;transition:opacity .5s}.flap{position:absolute;inset:0;background:linear-gradient(140deg,#2c5849,#14382f);clip-path:polygon(0 0,100% 0,50% 65%);transform-origin:top;transition:transform .9s;z-index:7;backface-visibility:hidden}.pocket{position:absolute;inset:0;background:#153c31;clip-path:polygon(0 0,50% 48%,100% 0,100% 100%,0 100%);z-index:5}.script{position:absolute;bottom:22px;left:0;right:0;color:#dec78f;font-size:23px;font-style:italic;z-index:6}.bundle{position:absolute;width:72%;height:225px;top:8px;left:14%;z-index:4;transition:transform 1.1s .6s,opacity .6s 1.8s;box-shadow:0 5px 10px #0002;background:var(--cream);border-radius:45% 45% 3px 3px}.bundle img.main-mini{width:100%;height:100%;object-fit:fill;border-radius:45% 45% 3px 3px}.bundle .belly{position:absolute;left:-5%;top:41%;width:110%;height:42px;object-fit:cover;box-shadow:0 2px 5px #0003;transition:transform .7s 1.6s,opacity .6s 1.9s}.opened .flap{transform:rotateX(180deg);z-index:1}.opened .lining{opacity:1}.opened .bundle{transform:translateY(-115px);opacity:0}.opened .bundle .belly{transform:translateX(150px);opacity:0}.cards{display:none;flex-direction:column;align-items:center;gap:30px;margin:30px auto}.cards.visible{display:flex}.card{width:min(84vw,360px);background:none;border:0;padding:0;cursor:pointer;opacity:0;transform:translateY(25px);animation:rise .7s forwards;filter:drop-shadow(0 10px 12px #392e2633)}.card:nth-child(2){animation-delay:.3s}.card:nth-child(3){animation-delay:.6s}.card:nth-child(4){animation-delay:.9s}.card:nth-child(5){animation-delay:1.2s}.card:nth-child(6){animation-delay:1.5s}.card img{width:100%;display:block}.card.arch img{clip-path:polygon(0 13%,4% 7%,12% 3%,25% 0,75% 0,88% 3%,96% 7%,100% 13%,100% 100%,0 100%);border-radius:48% 48% 2px 2px}.card.oval img{border-radius:50%}.card.label{font-size:14px}.card small{display:block;margin-top:7px;font-size:14px;letter-spacing:.08em;color:var(--green)}@keyframes rise{to{opacity:1;transform:translateY(0)}}button.action,a.action{display:inline-block;margin:15px 5px;padding:13px 22px;border:1px solid var(--green);border-radius:30px;background:var(--green);color:white;font:15px Georgia,serif;cursor:pointer;text-decoration:none}.action.secondary{background:transparent;color:var(--green)}.modal{position:fixed;inset:0;background:#141e1bdc;display:none;align-items:center;justify-content:center;z-index:20;padding:25px}.modal.active{display:flex}.modal img{max-height:83vh;max-width:94vw;object-fit:contain;background:#fff}.close{position:absolute;top:10px;right:15px;color:white;background:none;border:0;font-size:35px;cursor:pointer}.foot{font-size:12px;opacity:.75;line-height:1.5}#open{position:absolute;inset:0;border:0;background:transparent;z-index:9;cursor:pointer}#open:focus-visible{outline:3px solid #a8894d}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main><h1>Alexis & John</h1><div class="date">JANUARY 29, 2027</div><p class="hint" id="hint">Tap the envelope to open your invitation</p><div class="stage"><div class="envelope" id="env"><div class="back"></div><div class="lining"></div><div class="bundle"><img class="main-mini" src="main.webp" alt="Invitation bundle"><img class="belly" src="band.webp" alt="Swan floral belly band"></div><div class="flap"></div><div class="pocket"></div><div class="script">See You in January?</div><button id="open" aria-label="Open the envelope"></button></div></div><section id="cards" class="cards" aria-label="Invitation cards"><button class="card arch" data-image="main.webp" aria-label="Enlarge main invitation"><img src="main.webp" alt="Main wedding invitation"><small>Wedding Invitation</small></button><button class="card" data-image="reception.webp" aria-label="Enlarge reception card"><img src="reception.webp" alt="Reception details"><small>Reception</small></button><button class="card oval" data-image="welcome.webp" aria-label="Enlarge welcome party card"><img src="welcome.webp" alt="Welcome party details"><small>Welcome Party</small></button><button class="card oval" data-image="welcome_back.webp" aria-label="Enlarge illustrated welcome card reverse"><img src="welcome_back.webp" alt="Lighthouse illustration on back of welcome card"><small>Welcome Card — Reverse</small></button><button class="card arch" data-image="rehearsal.webp" aria-label="Enlarge rehearsal dinner card"><img src="rehearsal.webp" alt="Rehearsal dinner details"><small>Rehearsal Dinner</small></button><button class="card" data-image="rsvp.webp" aria-label="Enlarge RSVP card"><img src="rsvp.webp" alt="RSVP details"><small>RSVP Card</small></button></section><button class="action secondary" id="replay">Replay</button><a class="action" href="https://www.zola.com/wedding/brattebo27" target="_blank" rel="noopener">RSVP on Zola</a><p class="foot">Tap any card to enlarge it. Please confirm all times and details on the wedding website.</p></main><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Enlarged invitation"><button class="close" id="close" aria-label="Close">×</button><img id="large" alt="Enlarged invitation card"></div><script>
const env=document.getElementById('env'),cards=document.getElementById('cards'),hint=document.getElementById('hint'),modal=document.getElementById('modal'),large=document.getElementById('large');let timer;function openIt(){if(env.classList.contains('opened'))return;env.classList.add('opened');hint.textContent='The invitation bundle is sliding out...';timer=setTimeout(()=>{cards.classList.add('visible');hint.textContent='Tap each card to see the original artwork';},2100)}document.getElementById('open').onclick=openIt;document.getElementById('replay').onclick=()=>{clearTimeout(timer);env.classList.remove('opened');cards.classList.remove('visible');hint.textContent='Tap the envelope to open your invitation';window.scrollTo({top:0,behavior:'smooth'})};document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{large.src=b.dataset.image;large.alt=b.querySelector('img').alt;modal.classList.add('active')});function close(){modal.classList.remove('active')}document.getElementById('close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};
</script></body></html>
